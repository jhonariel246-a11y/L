# ============================================================================
# InsightPay — TODO en tu servidor (Camino A): base de datos + backend + web.
# Uso en el VPS:
#   1) copia el repo al servidor
#   2) crea deploy/.env a partir de deploy/.env.example y pon claves reales
#   3) docker compose -f deploy/docker-compose.yml up -d --build
#   4) apunta insightpay.lat al servidor y pon HTTPS (Caddy/nginx delante)
# ============================================================================
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      # el esquema se aplica solo la primera vez que arranca la BD
      - ../server/db/schema.sql:/docker-entrypoint-initdb.d/0001_schema.sql:ro
    # No exponemos el puerto al exterior: solo el backend habla con la BD.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      INSIGHTPAY_MASTER_KEY: ${INSIGHTPAY_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      # servir el frontend (repo) y persistir los certificados cifrados
      - ../:/repo:ro
      - certs_data:/app/data
    ports:
      - "3000:3000"

volumes:
  db_data:
  certs_data:
